# Bezpečnostní kontrola Trivy: uniklá tajemství (hesla, klíče, tokeny) a známé zranitelnosti v knihovnách.
# Trivy byl v březnu 2026 napaden (CVE-2026-33634, podvržené tagy trivy-action a binárka v0.69.4), proto
# se nepoužívá trivy-action, ale pevná verze binárky ověřená otiskem SHA-256 zapsaným přímo tady.
# Novou verzi Trivy je potřeba změnit ručně: TRIVY_VERSION + TRIVY_SHA256 ze souboru trivy_<verze>_checksums.txt.
name: Bezpečnost (Trivy)

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"   # každé pondělí: nové zranitelnosti i v nezměněném kódu
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # nahrání výsledků do Security tabu
    env:
      TRIVY_VERSION: "0.75.0"
      TRIVY_SHA256: "c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalace Trivy (pevná verze, ověřený otisk)
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum -c -
          tar -xzf trivy.tgz trivy
          ./trivy --version

      - name: Trivy – kompletní přehled (SARIF, jen hlásí)
        run: |
          "$RUNNER_TEMP/trivy" fs --scanners vuln,secret,misconfig --ignorefile .trivyignore \
            --format sarif --output "$RUNNER_TEMP/trivy-results.sarif" --exit-code 0 .

      - name: Nahrát výsledky do Security tabu
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ runner.temp }}/trivy-results.sarif
          category: trivy

      - name: Trivy – brána (HIGH / CRITICAL)
        run: |
          "$RUNNER_TEMP/trivy" fs --scanners vuln,secret --ignorefile .trivyignore --skip-db-update \
            --severity HIGH,CRITICAL --ignore-unfixed --format table --exit-code 1 .
