# CodeQL: bezpečnostní analýza vlastního kódu C/C++ (přetečení bufferů, práce s neověřenými daty ze souboru,
# use-after-free…). Kód se skutečně přeloží (build-mode: manual), CodeQL sleduje překlad a analyzuje jen to,
# co se zkompiluje. Výsledky jsou v záložce Security → Code scanning a u řádků v pull requestech.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"   # každé pondělí: nové verze dotazů CodeQL
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (C/C++)
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write   # nahrání výsledků do Security tabu
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Inicializace CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: c-cpp
          build-mode: manual
          config-file: ./.github/codeql/codeql-config.yml

      - name: Překlad native/ (CodeQL sleduje kompilaci)
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set "VS=%%i"
          call "%VS%\VC\Auxiliary\Build\vcvars64.bat" >nul
          call native\build.cmd

      - name: Analýza
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:c-cpp"
