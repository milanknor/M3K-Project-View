# Vydání: sestaví program a instalátor na čistém Windows u GitHubu – jen když je verze v chráněné větvi main
# a všechny povinné kontroly (MSVC, Trivy, CodeQL) u téhož commitu prošly. K souborům vystaví atestaci původu
# (ověření: gh attestation verify <soubor> --repo milanknor/M3K-Project-View) a vytvoří GitHub Release.
# Spuštění: push značky native-vX.Y.Z. Ruční spuštění (Run workflow) = zkušební sestavení, nic se nevydá.
# Bez certifikátu se soubory digitálně nepodepisují (Windows ukážou „Neznámý vydavatel“).
name: Vydání

on:
  push:
    tags: ["native-v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Značka nebo commit ke zkušebnímu sestavení (nic se nevydá)"
        required: true
        default: main

permissions:
  contents: read

jobs:
  brana:
    name: Kontroly prošly
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Commit k sestavení
        id: sha
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$REF" --jq .sha)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Sestavuje se $REF = $sha"

      - name: Commit je v chráněné větvi main
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          stav=$(gh api "repos/$GITHUB_REPOSITORY/compare/$SHA...main" --jq .status)
          echo "main vůči commitu: $stav"
          case "$stav" in
            ahead|identical) ;;
            *) echo "::error::Commit není v main – vydat jde jen zkontrolovaný kód z main"; exit 1 ;;
          esac

      - name: Povinné kontroly u commitu prošly
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          # Po sloučení do main mohou kontroly ještě běžet – čeká nejdéle 40 minut.
          for i in $(seq 1 80); do
            hotovo=1
            for jmeno in "Překlad a analýza MSVC" "Trivy" "CodeQL (C/C++)"; do
              stav=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?per_page=100" \
                --jq "[.check_runs[] | select(.name == \"$jmeno\")] | sort_by(.started_at) | last | \"\(.status // \"chybi\")/\(.conclusion // \"\")\"")
              echo "$jmeno: $stav"
              case "$stav" in
                completed/success) ;;
                completed/*) echo "::error::Kontrola „$jmeno“ neprošla ($stav)"; exit 1 ;;
                *) hotovo=0 ;;
              esac
            done
            [ "$hotovo" = 1 ] && exit 0
            sleep 30
          done
          echo "::error::Kontroly nedoběhly do 40 minut"; exit 1

  sestaveni:
    name: Sestavení instalátoru
    needs: brana
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write        # atestace původu (Sigstore)
      attestations: write
    env:
      INNO_VERSION: "6.7.3"
      INNO_SHA256: "9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.brana.outputs.sha }}
          persist-credentials: false

      - name: Verze v kódu odpovídá značce
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $ver = (Select-String -Path native/mppview.iss -Pattern '^AppVersion=(.+)$').Matches[0].Groups[1].Value.Trim()
          if ("native-v$ver" -ne $env:GITHUB_REF_NAME) { "::error::Značka $env:GITHUB_REF_NAME neodpovídá verzi $ver v mppview.iss"; exit 1 }
          "Verze $ver odpovídá značce."

      - name: Instalace Inno Setup (pevná verze, ověřený otisk)
        shell: pwsh
        run: |
          $f = Join-Path $env:RUNNER_TEMP "innosetup.exe"
          $tag = "is-" + ($env:INNO_VERSION -replace '\.', '_')
          Invoke-WebRequest "https://github.com/jrsoftware/issrc/releases/download/$tag/innosetup-$env:INNO_VERSION.exe" -OutFile $f
          $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
          if ($h -ne $env:INNO_SHA256) { "::error::Otisk Inno Setup nesedí: $h"; exit 1 }
          $cil = Join-Path $env:LOCALAPPDATA "Programs\Inno Setup 6"
          Start-Process $f -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=`"$cil`"" -Wait
          if (-not (Test-Path (Join-Path $cil "ISCC.exe"))) { "::error::ISCC.exe se nenainstaloval"; exit 1 }
          "Inno Setup $env:INNO_VERSION nainstalován, otisk ověřen."

      - name: Instalace WiX Toolset (pevná verze, ověřený otisk)
        shell: pwsh
        env:
          WIX_VERSION: "5.0.2"   # licence MS-RL; WiX 6+ má licenci s poplatkem (OSMF)
          WIX_SHA512: "z+fu1deTcaV+TRCo4+6HrJ48Sdnj+yeQjjMStTI3GW7NxFEPaknYCdxrf0qEvgdXrjYdjLnkZKCsNSqTTOo2OA=="
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "wixpkg"; New-Item -ItemType Directory -Force $dir | Out-Null
          $pkg = Join-Path $dir "wix.$env:WIX_VERSION.nupkg"
          Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/wix/$env:WIX_VERSION/wix.$env:WIX_VERSION.nupkg" -OutFile $pkg
          $h = [Convert]::ToBase64String([Security.Cryptography.SHA512]::Create().ComputeHash([IO.File]::ReadAllBytes($pkg)))
          if ($h -ne $env:WIX_SHA512) { "::error::Otisk balíčku WiX nesedí: $h"; exit 1 }
          # instalace jen z ověřeného balíčku (žádný jiný zdroj NuGet)
          $cfg = Join-Path $dir "nuget.config"
          Set-Content $cfg "<?xml version=`"1.0`" encoding=`"utf-8`"?><configuration><packageSources><clear /><add key=`"overeno`" value=`"$dir`" /></packageSources></configuration>"
          dotnet tool install --global wix --version $env:WIX_VERSION --configfile $cfg
          if ($LASTEXITCODE) { exit 1 }
          Join-Path $env:USERPROFILE ".dotnet\tools" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "WiX $env:WIX_VERSION nainstalován, otisk ověřen."

      - name: Sestavení programu a instalátorů (EXE a MSI)
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set "VS=%%i"
          call "%VS%\VC\Auxiliary\Build\vcvars64.bat" >nul
          call native\build.cmd setup

      - name: Program nepoužívá síť
        shell: pwsh
        run: |
          $sit = 'ws2_32','wsock32','mswsock','wininet','winhttp','urlmon','httpapi','webio','dnsapi','netapi32'
          $nalez = @()
          foreach ($n in 'mppview.exe','mppread.dll') {
            $b = [IO.File]::ReadAllBytes("native/out/$n")
            $a = [Text.Encoding]::ASCII.GetString($b).ToLower(); $u = [Text.Encoding]::Unicode.GetString($b).ToLower()
            foreach ($s in $sit) { if ($a.Contains($s) -or $u.Contains($s)) { $nalez += "${n}: $s" } }
          }
          if ($nalez) { $nalez | ForEach-Object { "::error::Síťová knihovna v programu – $_" }; exit 1 }
          "Bez síťových knihoven: mppview.exe, mppread.dll"

      - name: Soubory k vydání a otisky
        shell: pwsh
        run: |
          $ver = (Select-String -Path native/mppview.iss -Pattern '^AppVersion=(.+)$').Matches[0].Groups[1].Value.Trim()
          New-Item -ItemType Directory -Force vydani, program | Out-Null
          Copy-Item "native/out/M3K-Project-View-$ver-Setup.exe", "native/out/M3K-Project-View-$ver.msi" vydani/
          Copy-Item native/out/mppread-src.zip "vydani/mppread-src-$ver.zip"
          Copy-Item native/out/mppview.exe, native/out/mppread.dll program/
          foreach ($f in Get-ChildItem vydani, program -File) {
            $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            [IO.File]::WriteAllText("$($f.FullName).sha256", "$h  $($f.Name)`n")
            "$h  $($f.Name)"
          }

      - name: Atestace původu
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            vydani/*.exe
            vydani/*.msi
            vydani/*.zip
            program/*.exe
            program/*.dll

      - name: Uložit instalátor a zdroje
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vydani
          path: vydani/
          if-no-files-found: error

      - name: Uložit soubory programu (ke kontrole)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: program
          path: program/
          if-no-files-found: error

  vydani:
    name: GitHub Release
    needs: [brana, sestaveni]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # vytvoření vydání
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vydani
          path: vydani

      - name: Kontrola otisků
        run: |
          cd vydani
          for f in *.sha256; do sha256sum -c "$f"; done

      - name: Vytvořit vydání
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.brana.outputs.sha }}
        run: |
          ver="${GITHUB_REF_NAME#native-v}"
          gh release create "$GITHUB_REF_NAME" vydani/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "M3K Project View $ver" \
            --notes "Sestaveno na GitHubu z commitu $SHA po úspěšných kontrolách (MSVC, Trivy, CodeQL). Soubory nejsou digitálně podepsané; původ ověříte příkazem: gh attestation verify <soubor> --repo $GITHUB_REPOSITORY"
